<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Links & Community</title>
  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 2px solid #38bdf8;
      object-fit: cover;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 15px;
      border: 1px solid #334155;
      transition: all 0.2s ease;
    }
    .link-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    /* 突出显示的黄金按钮（通常给 Steam 或核心下载） */
    .highlight {
      background: linear-gradient(90deg, #0284c7 0%, #2563eb 100%);
      border: none;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .highlight:hover {
      background: linear-gradient(90deg, #0369a1 0%, #1d4ed8 100%);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- repace our game picture-->
    <img src="https://via.placeholder.com/90" alt="Game Logo" class="avatar">
    <div class="title">Game Name</div>
    <div class="subtitle">Join our community and stay tuned for the latest updates!</div>

    <!-- link -->
    <a href="https://store.steampowered.com" class="link-btn highlight" target="_blank">🎮 Wishlist on Steam</a>
    <a href="https://discord.gg" class="link-btn" target="_blank">💬 Join Our Discord</a>
    <a href="https://twitter.com" class="link-btn" target="_blank">🐦 Follow on X (Twitter)</a>
    <a href="https://youtube.com" class="link-btn" target="_blank">📺 Watch Gameplay Trailer</a>
    <a href="https://yourwebsite.com" class="link-btn" target="_blank">🌐 Official Website</a>
  </div>

</body>
</html>
